# Продакшн-стек: backend + secretary + LiveKit + Egress + Redis.
# Reverse proxy, TLS, домены — ответственность того, кто деплоит (см.
# docs/DEPLOY.md): proxy отдаёт https://hub.<домен>, /rtc* → 127.0.0.1:7880,
# остальное → 127.0.0.1:8090. Proxy должен работать на хосте или на
# host network: сервисы слушают loopback.
#
# host network: LiveKit сам слушает UDP/TCP порты на хосте (доки рекомендуют),
# backend/egress ходят на него по loopback (localhost:7880), Caddy-нет —
# апстримы те же.

services:
  # host network: LiveKit сам слушает UDP/TCP порты на хосте (доки рекомендуют)
  livekit-server:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
      # Сертификаты TURN — ответственность деплоера: кладёт .crt/.key в
      # deploy/certs/ и раскомментирует блок turn: в livekit.yaml (/certs/...).
      - ./deploy/certs:/certs:ro
    command: ["--config", "/etc/livekit.yaml"]
    logging: &log-rotate
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - redis

  # Valkey 7.2 — дроп-ин Redis (та же очередь Egress для livekit/egress,
  # протокол совместим, данных не хранит). Имя сервиса оставлено redis:
  # livekit/egress на host network ходят на localhost:6379 (порт опубликован
  # на loopback).
  redis:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

  # Права на записи: named volume создаётся docker'ом root:root 755, а egress
  # в образе — uid 1001. Запускать egress root'ом нельзя (entrypoint поднимает
  # pulseaudio, тот под root падает) — поэтому разовый init из образа самого
  # egress (не busybox) отдаёт каталог пользователю egress (gid 0 у него уже
  # root-группа).
  recordings-init:
    image: livekit/egress:latest
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1001:0 /out/recordings && chmod 775 /out/recordings"]
    volumes:
      - recordings:/out/recordings

  livekit-egress:
    image: livekit/egress:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./deploy/egress.yaml:/etc/egress.yaml:ro
      - recordings:/out/recordings
    logging: *log-rotate
    depends_on:
      redis:
        condition: service_started
      livekit-server:
        condition: service_started
      recordings-init:
        condition: service_completed_successfully

  # host network: бэкенд ходит на livekit через localhost (в bridge-сети
  # localhost — это сам контейнер, и 7880 недоступен). listen в конфиге —
  # 127.0.0.1:8090, наружу 8090 не торчит (reverse proxy ходит по loopback).
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
      # Сеть хоста: у bun-стейджа нет fallback на IPv4, а в bridge-сети
      # buildkit IPv6 недоступен — bun install висит (npm резолвится в AAAA).
      network: host
    restart: unless-stopped
    network_mode: host
    volumes:
      # Путь в config.yaml относительный (./data) — монтируем конфиг под
      # /etc/office, чтобы он резолвился в смонтированный каталог.
      # web-dist — в образе (см. server/Dockerfile), web_dir в конфиге абсолютный.
      # Записи — named volume recordings (общий с egress и secretary).
      - ./config.yaml:/etc/office/config.yaml:ro
      - recordings:/etc/office/data/recordings
    command: ["-config", "/etc/office/config.yaml"]
    env_file:
      - path: .env
        required: false
    logging: *log-rotate

  # Секретарь: воркер AI-сводок (server/cmd/secretary). Тот же образ, другой
  # entrypoint; смотрит записи с флагом summary и разбирает их STT → LLM.
  # Секреты — .env (env_file), каталог записей — общий volume.
  secretary:
    build:
      context: .
      dockerfile: server/Dockerfile
      # См. backend: bun install в bridge-сети buildkit висит на IPv6.
      network: host
    restart: unless-stopped
    entrypoint: ["office-secretary"]
    environment:
      LLM_PROMPT_FILE: /etc/office/secretary-prompt.md
    env_file:
      - path: .env
        required: false
    volumes:
      - recordings:/data/recordings
      # системный промпт — редактируется на хосте, подхватывается без перезапуска
      - ./deploy/secretary-prompt.md:/etc/office/secretary-prompt.md:ro
    logging: *log-rotate
    depends_on:
      recordings-init:
        condition: service_completed_successfully

volumes:
  # Записи: named volume, а не bind-mount — не зависит от прав хостового
  # каталога. Права внутри чинит одноразовый recordings-init (образ egress).
  # В dev — bind в data/recordings через docker-compose.dev.yml.
  recordings:
    name: office-recordings