port: 7880
log_level: info

rtc:
  tcp_port: 7881
  # 100 портов хватает с запасом: участник занимает ~2 порта (публикация + подписка),
  # при реконнектах старые порты освобождаются. Меньше диапазон — уже правило фаервола.
  port_range_start: 50000
  port_range_end: 50100
  # включить на проде, если сервер за NAT с публичным IP (LiveKit сам определит IP через STUN)
  # use_external_ip: true

redis:
  address: localhost:6379

keys:
  # dev-ключи. Для продакшна сменить: openssl rand -hex 32
  devkey: 737e1186bfd64c48162e1f5981eda21b

room:
  auto_create: true
  empty_timeout: 120

# TURN — Фаза 4: нужен домен и сертификат (выпускается Caddy, см. Caddyfile).
# Раскомментировать после получения серта. Путь — фактическое расположение в
# volume caddy_data: Caddy кладёт серт в подкаталог issuer'а
# (acme-v02.api.letsencrypt.org-directory) — проверь после первого выпуска.
# turn:
#   enabled: true
#   domain: turn.example.com
#   cert_file: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.example.com/turn.example.com.crt
#   key_file: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.example.com/turn.example.com.key
#   tls_port: 5349
#   udp_port: 3478
