port: 7880
log_level: info

rtc:
  tcp_port: 7881
  # 100 портов хватает с запасом: участник занимает ~2 порта (публикация + подписка),
  # при реконнектах старые порты освобождаются. Меньше диапазон — уже правило фаервола.
  port_range_start: 50000
  port_range_end: 50100
  # включить на проде, если сервер за NAT с публичным IP (LiveKit сам определит IP через STUN)
  # use_external_ip: true

redis:
  address: localhost:6379

keys:
  # dev-ключи. Для продакшна сменить: openssl rand -hex 32
  devkey: 737e1186bfd64c48162e1f5981eda21b

room:
  auto_create: true
  empty_timeout: 120

# TURN — нужен домен и сертификат. Сертификат достаёт деплоер (из своего
# reverse proxy / своего CA / ACME) и кладёт в deploy/certs/ — каталог
# смонтирован в контейнер как /certs (см. docker-compose.yml).
# Раскомментировать после готовности серта и перезапустить стек.
# turn:
#   enabled: true
#   domain: turn.example.com
#   cert_file: /certs/turn.example.com.crt
#   key_file: /certs/turn.example.com.key
#   tls_port: 5349
#   udp_port: 3478
