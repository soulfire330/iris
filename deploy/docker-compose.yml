services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend

  # host network: LiveKit сам слушает UDP/TCP порты на хосте (доки рекомендуют)
  livekit-server:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      # серт TURN читаем из хранилища сертификатов Caddy (Фаза 4)
      - caddy_data:/caddy-data:ro
    command: ["--config", "/etc/livekit.yaml"]
    logging: &log-rotate
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

  # Права на общий каталог записей: docker создаёт bind-mount root:root 755,
  # а egress работает под uid 1001 и не может писать. Разовый контейнер
  # делает каталог группово-писаемым (группа root = gid 0 у egress).
  recordings-init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    volumes:
      - ../data/recordings:/out/recordings
    entrypoint: ["sh", "-c", "chgrp 0 /out/recordings && chmod 775 /out/recordings"]

  livekit-egress:
    image: livekit/egress:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - ../data/recordings:/out/recordings
    logging: *log-rotate
    depends_on:
      redis:
        condition: service_started
      livekit-server:
        condition: service_started
      recordings-init:
        condition: service_completed_successfully

  backend:
    build:
      context: ../server
    image: office
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      # Пути в config.yaml относительные (./data, ./web-dist) — монтируем всё
      # под /etc/office, чтобы они резолвились в смонтированные каталоги.
      - ../config.yaml:/etc/office/config.yaml:ro
      - ../data:/etc/office/data
      - ../web/dist:/etc/office/web-dist:ro
    command: ["-config", "/etc/office/config.yaml"]
    env_file:
      - path: ../.env
        required: false
    logging: *log-rotate

  # Секретарь: воркер AI-сводок (server/cmd/secretary). Тот же образ, другой
  # entrypoint; смотрит записи с флагом summary и разбирает их STT → LLM.
  # Секреты — .env (env_file), каталог записей — общий volume.
  secretary:
    image: office
    restart: unless-stopped
    entrypoint: ["office-secretary"]
    environment:
      LLM_PROMPT_FILE: /etc/office/secretary-prompt.md
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../data/recordings:/data/recordings
      # системный промпт — редактируется на хосте, подхватывается без перезапуска
      - ../deploy/secretary-prompt.md:/etc/office/secretary-prompt.md:ro
    logging: *log-rotate
    depends_on:
      recordings-init:
        condition: service_completed_successfully

volumes:
  caddy_data:
