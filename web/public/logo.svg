<svg width="234" height="234" viewBox="139 139 234 234" xmlns="http://www.w3.org/2000/svg">
  <!-- комната: тонкое кольцо, не замкнутое до конца — оставляет "воздух" -->
  <circle
    cx="256" cy="256" r="112"
    fill="none"
    stroke="#9184d9"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="640 40"
    transform="rotate(-90 256 256)"
  />

  <!-- присутствие ассистента: спокойная точка, немного не в центре -->
  <circle cx="278" cy="278" r="20" fill="#79c4c6"/>
</svg>
