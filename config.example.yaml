# Шаблон конфига. Скопируй в config.yaml (он в .gitignore) и впиши свои
# значения: cp config.example.yaml config.yaml

server:
  # loopback: в проде бэкенд на host network (ходит на livekit через localhost),
  # а наружу 8090 не выставляется — Caddy проксирует по 127.0.0.1.
  listen: "127.0.0.1:8090"
  livekit:
    host: localhost:7880
    api_key: devkey
    # сгенерируй: openssl rand -hex 32
    api_secret: <secret>
  data_dir: ./data
  # Путь в образе office (см. server/Dockerfile); в dev фронт отдаёт vite.
  web_dir: /usr/share/office/web-dist

# Комнаты: name — ID (имя комнаты LiveKit, только латиница/цифры/точка/дефис/
# подчёркивание), display — подпись в селекте логина и шапке. Порядок списка —
# порядок в селекте, первая выбрана по умолчанию. Минимум одна комната.
rooms:
  - name: office
    display: Офис
  - name: war-room
    display: Комната переговоров

employees:
  - login: admin
    name: Админ
    # пароль сгенерируй: scripts/hashpass.sh 'пароль'
    password_hash: $2a$10$...
